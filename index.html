<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Éditeur ABC tactile</title>
  <style>
    /* styles identiques */
    * { box-sizing: border-box; user-select: none; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .app { background: white; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); padding: 20px; max-width: 800px; width: 100%; }
    h1 { text-align: center; font-size: 1.4rem; margin: 0 0 16px 0; color: #333; }
    #abc-container { background: white; border: 2px solid #ddd; border-radius: 12px; overflow: hidden; touch-action: none; cursor: pointer; margin-bottom: 16px; position: relative; min-height: 180px; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    #abc-container svg { display: block; width: 100%; height: auto; background: white; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
    .controls button { flex: 1; min-width: 70px; padding: 10px 12px; border: 2px solid #ccc; border-radius: 30px; background: white; font-size: 1rem; font-weight: bold; color: #333; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
    .controls button.active { border-color: #007bff; background: #007bff; color: white; }
    .controls button:active { transform: scale(0.95); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .actions button { padding: 10px 20px; border: none; border-radius: 30px; background: #007bff; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; flex: 1; min-width: 80px; }
    .actions button.reset { background: #dc3545; }
    .actions button.reset:hover { background: #c82333; }
    .actions button.abc { background: #28a745; }
    .actions button.abc:hover { background: #218838; }
    .info { text-align: center; font-size: 0.9rem; color: #555; margin-top: 12px; min-height: 24px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal h2 { margin-top: 0; text-align: center; color: #333; }
    .modal textarea { flex: 1; min-height: 200px; font-family: 'Courier New', monospace; font-size: 0.9rem; padding: 12px; border: 2px solid #ddd; border-radius: 10px; resize: vertical; margin-bottom: 16px; background: #fafafa; }
    .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal .modal-actions button { padding: 10px 24px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .modal .modal-actions .close-btn { background: #6c757d; color: white; }
    .modal .modal-actions .update-btn { background: #007bff; color: white; }
    @media (max-width: 500px) { .controls button { min-width: 60px; padding: 8px 10px; font-size: 0.9rem; } }
    .log-area { background: #f0f0f0; border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 0.8rem; color: #333; max-height: 100px; overflow-y: auto; font-family: monospace; border: 1px solid #ddd; display: none; }
  </style>
</head>
<body>
<div class="app">
  <h1>🎵 Éditeur ABC tactile</h1>
  <div id="abc-container">
    <div style="text-align:center;color:#888;padding:20px;">
      <div style="font-size:24px;margin-bottom:8px;">⏳</div>
      Chargement de la bibliothèque musicale...
    </div>
  </div>
  <div class="controls">
    <button data-duration="quarter" class="active">♩ Noire</button>
    <button data-duration="half">𝅝 Blanche</button>
    <button data-duration="eighth">♪ Croche</button>
  </div>
  <div class="info" id="info">Cliquez sur la portée pour ajouter une note</div>
  <div class="actions">
    <button class="reset" id="resetBtn">🗑️ Effacer</button>
    <button class="abc" id="abcBtn">📄 ABC</button>
  </div>
  <div id="logArea" class="log-area"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Code ABC</h2>
    <textarea id="abcTextarea" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="close-btn" id="modalCloseBtn">Fermer</button>
      <button class="update-btn" id="modalUpdateBtn">Mettre à jour</button>
    </div>
  </div>
</div>

<script>
  // Fonction de log pour afficher dans la console et dans l'élément DOM
  function logMessage(msg, type) {
    const logArea = document.getElementById('logArea');
    if (logArea) {
      logArea.style.display = 'block';
      const entry = document.createElement('div');
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      if (type === 'error') entry.style.color = '#d32f2f';
      else if (type === 'success') entry.style.color = '#2e7d32';
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
    }
    console.log(msg);
  }

  // Chargement direct depuis le CDN (on utilise une balise script classique)
  // Mais on va le faire dynamiquement pour avoir un contrôle
  function loadAbcjs() {
    logMessage('Chargement de abcjs depuis le CDN...');
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/abcjs@6.4.0/dist/abcjs-basic-min.js';
    script.onload = function() {
      logMessage('Script abcjs chargé avec succès', 'success');
      if (typeof abcjs !== 'undefined') {
        logMessage('abcjs disponible, version: ' + abcjs.version, 'success');
        initApp();
      } else {
        logMessage('ERREUR: abcjs non défini après chargement', 'error');
        document.getElementById('abc-container').innerHTML = '<div style="color:red;padding:20px;">Erreur: abcjs non trouvé.</div>';
      }
    };
    script.onerror = function() {
      logMessage('ERREUR: impossible de charger le script depuis le CDN', 'error');
      document.getElementById('abc-container').innerHTML = '<div style="color:red;padding:20px;">Impossible de charger abcjs. Vérifiez votre connexion.</div>';
    };
    document.head.appendChild(script);
  }

  // Fonction d'initialisation de l'application
  function initApp() {
    logMessage('Initialisation de l\'application...');
    // ... le code de l'application (identique à avant)
    // On va tout mettre ici
    // (on recopie le code de l'app avec des logs supplémentaires)

    // ... (on va réécrire l'app avec logs)
    // Pour éviter la duplication, on peut tout mettre dans cette fonction

    // On va définir toutes les variables et fonctions ici
    var notes = [];
    var currentDuration = 'quarter';
    var abcText = '';
    var isRendering = false;

    var container = document.getElementById('abc-container');
    var info = document.getElementById('info');
    var resetBtn = document.getElementById('resetBtn');
    var abcBtn = document.getElementById('abcBtn');
    var modalOverlay = document.getElementById('modalOverlay');
    var abcTextarea = document.getElementById('abcTextarea');
    var modalCloseBtn = document.getElementById('modalCloseBtn');
    var modalUpdateBtn = document.getElementById('modalUpdateBtn');
    var durationButtons = document.querySelectorAll('.controls button[data-duration]');

    function buildAbc() {
      var header = 'X:1\nM:4/4\nK:C clef=treble\n';
      var body = notes.length ? '| ' + notes.join(' ') + ' |' : '| z4 |';
      var full = header + body;
      logMessage('Construction ABC: ' + full);
      return full;
    }

    function getNoteFromY(y, svgHeight) {
      var topMargin = 0.15;
      var bottomMargin = 0.85;
      var relY = y / svgHeight;
      if (relY < topMargin - 0.05 || relY > bottomMargin + 0.05) return null;
      var positions = [];
      for (var i = 0; i <= 8; i++) {
        positions.push(bottomMargin - i * 0.0875);
      }
      var minDist = Infinity;
      var bestIndex = 0;
      for (var j = 0; j < positions.length; j++) {
        var dist = Math.abs(relY - positions[j]);
        if (dist < minDist) {
          minDist = dist;
          bestIndex = j;
        }
      }
      var baseNotes = ['E', 'F', 'G', 'A', 'B', 'c', 'd', 'e', 'f'];
      var note;
      if (bestIndex < 0) {
        var graves = ['D', 'C', 'B,', 'A,', 'G,', 'F,', 'E,', 'D,'];
        var idx = Math.abs(bestIndex) - 1;
        note = idx < graves.length ? graves[idx] : 'C,';
      } else if (bestIndex < baseNotes.length) {
        note = baseNotes[bestIndex];
      } else {
        var aigues = ['g', 'a', 'b', "c'", "d'", "e'", "f'", "g'", "a'", "b'", "c''"];
        var idx2 = bestIndex - baseNotes.length;
        note = idx2 < aigues.length ? aigues[idx2] : "c''";
      }
      logMessage('Note détectée: ' + note + ' (y=' + y + ', relY=' + relY + ')');
      return note;
    }

    function addNote(noteAbc) {
      if (!noteAbc) return;
      var durationSuffix = '';
      switch (currentDuration) {
        case 'half':   durationSuffix = '2'; break;
        case 'eighth': durationSuffix = '/'; break;
        default:       durationSuffix = '';  break;
      }
      var fullNote = noteAbc + durationSuffix;
      notes.push(fullNote);
      logMessage('Ajout de la note: ' + fullNote);
      updateAndRender();
    }

    function render() {
      logMessage('Rendu appelé');
      if (isRendering) {
        logMessage('Rendu déjà en cours, ignoré');
        return;
      }
      isRendering = true;
      abcText = buildAbc();
      try {
        container.innerHTML = '';
        var renderParams = {
          generateInline: true,
          generateDownload: false,
          generatePlayButton: false,
          responsive: 'resize'
        };
        logMessage('Appel de abcjs.renderAbc avec texte: ' + abcText);
        abcjs.renderAbc(container, abcText, renderParams);
        logMessage('Rendu effectué, conteneur contient maintenant ' + container.children.length + ' éléments');
        setTimeout(attachSVGEvents, 150);
        info.textContent = notes.length + ' note(s) — Cliquez sur la portée pour ajouter';
      } catch (e) {
        logMessage('ERREUR lors du rendu: ' + e.message, 'error');
        container.innerHTML = '<div style="padding:20px;color:#d32f2f;text-align:center;">❌ Erreur de rendu: ' + e.message + '</div>';
        info.textContent = 'Erreur de rendu, vérifiez le code ABC.';
      }
      isRendering = false;
    }

    function updateAndRender() {
      render();
    }

    function attachSVGEvents() {
      logMessage('Tentative d\'attachement des événements SVG');
      var svg = container.querySelector('svg');
      if (!svg) {
        logMessage('SVG non trouvé, nouvelle tentative dans 200ms', 'error');
        setTimeout(attachSVGEvents, 200);
        return;
      }
      logMessage('SVG trouvé, attachement des événements');
      function handlePointer(e) {
        e.preventDefault();
        var rect = svg.getBoundingClientRect();
        var svgWidth = svg.viewBox ? svg.viewBox.baseVal.width : svg.width.baseVal.value;
        var svgHeight = svg.viewBox ? svg.viewBox.baseVal.height : svg.height.baseVal.value;
        var clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        var scaleX = svgWidth / rect.width;
        var scaleY = svgHeight / rect.height;
        var x = (clientX - rect.left) * scaleX;
        var y = (clientY - rect.top) * scaleY;
        if (x < 0 || x > svgWidth || y < 0 || y > svgHeight) return;
        var note = getNoteFromY(y, svgHeight);
        if (note) {
          addNote(note);
        } else {
          logMessage('Clic hors zone de portée');
        }
      }
      if (svg._listener) {
        svg.removeEventListener('click', svg._listener);
        svg.removeEventListener('touchstart', svg._listener);
      }
      var listener = function(e) { handlePointer(e); };
      svg.addEventListener('click', listener);
      svg.addEventListener('touchstart', listener, { passive: false });
      svg._listener = listener;
      logMessage('Événements attachés avec succès', 'success');
    }

    // Gestion des boutons de durée
    durationButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        durationButtons.forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentDuration = this.dataset.duration;
        var durationNames = { quarter: 'Noire', half: 'Blanche', eighth: 'Croche' };
        info.textContent = 'Durée : ' + durationNames[currentDuration] + ' — Cliquez sur la portée';
        logMessage('Durée changée: ' + durationNames[currentDuration]);
      });
    });

    resetBtn.addEventListener('click', function() {
      notes = [];
      updateAndRender();
      info.textContent = 'Notes effacées — Cliquez sur la portée pour ajouter';
      logMessage('Notes effacées');
    });

    function openModal() {
      abcTextarea.value = abcText;
      modalOverlay.classList.add('open');
      logMessage('Modal ouverte');
    }
    function closeModal() {
      modalOverlay.classList.remove('open');
      logMessage('Modal fermée');
    }
    function updateFromModal() {
      var newAbc = abcTextarea.value;
      var match = newAbc.match(/\|\s*(.*?)\s*\|/);
      if (match) {
        var body = match[1].trim();
        notes = (body === 'z4' || body === '') ? [] : body.split(/\s+/).filter(function(s) { return s.length > 0; });
        updateAndRender();
        closeModal();
        logMessage('Mise à jour depuis le modal, notes: ' + notes.join(', '));
      } else {
        alert('Format ABC invalide. Conservez la structure X:1 M:4/4 K:C | ... |');
        logMessage('Erreur de mise à jour: format invalide', 'error');
      }
    }
    abcBtn.addEventListener('click', openModal);
    modalCloseBtn.addEventListener('click', closeModal);
    modalUpdateBtn.addEventListener('click', updateFromModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    // Initialisation
    notes = [];
    render();

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { render(); }, 300);
    });

    setTimeout(attachSVGEvents, 500);
    logMessage('Application initialisée', 'success');
  }

  // Démarrer le chargement
  loadAbcjs();
</script>
</body>
</html>
